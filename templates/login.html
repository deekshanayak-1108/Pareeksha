{% extends 'base.html' %}

{% block title %}Login - Pareeksha Assessment{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-5">
        <div class="card premium-card p-4">
            <div class="card-body">
                <h3 class="card-title text-center fw-bold mb-4 text-gradient">Welcome Back</h3>
                <form>
                    <div class="mb-3">
                        <label for="email" class="form-label text-muted-custom">Email Address</label>
                        <input type="email" class="form-control premium-input" id="email" placeholder="name@example.com" required>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label text-muted-custom">Password</label>
                        <input type="password" class="form-control premium-input" id="password" placeholder="••••••••" required>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary-premium py-2 fw-semibold">Sign In</button>
                    </div>
                </form>
                <div class="text-center mt-3">
                    <a href="#" class="text-muted-custom small">Forgot password?</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
