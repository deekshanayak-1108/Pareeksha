{% extends 'base.html' %}

{% block title %}ERP Portal - Login{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="col-md-5 col-lg-4">
        <div class="card premium-card p-4 shadow-lg">
            <div class="card-body text-center">
                <!-- Branding -->
                <div class="mb-4">
                    <div class="logo-box mb-2">
                        <i class="bi bi-mortarboard-fill text-gradient display-4"></i>
                    </div>
                    <h3 class="fw-bold text-gradient">PAREEKSHA ERP</h3>
                    <p class="text-muted-custom small">Exam Management & Allocation Portal</p>
                </div>
                
                <!-- Login Form -->
                <form action="/login" method="POST">
                    <div class="mb-3 text-start">
                        <label for="role" class="form-label text-muted-custom small">Select Role</label>
                        <select class="form-select premium-input" id="role" name="role" required>
                            <option value="student">Student</option>
                            <option value="faculty">Faculty</option>
                            <option value="admin">Administrator (Admin)</option>
                        </select>
                    </div>

                    <div class="mb-3 text-start">
                        <label for="email" class="form-label text-muted-custom small">Username or Email</label>
                        <input type="text" class="form-control premium-input" id="email" placeholder="Enter username" required>
                    </div>

                    <div class="mb-4 text-start">
                        <div class="d-flex justify-content-between">
                            <label for="password" class="form-label text-muted-custom small">Password</label>
                            <a href="#" class="text-gradient small text-decoration-none">Forgot Password?</a>
                        </div>
                        <input type="password" class="form-control premium-input" id="password" placeholder="••••••••" required>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary-premium py-2.5 fw-semibold">Sign In to Dashboard</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
